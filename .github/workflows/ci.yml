name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # electron 44 / @electron/packager 20 均要求 node >= 22.12.0
        with: { node-version: '24' }
      - run: npm ci --no-audit --no-fund
      - name: 语法检查
        run: |
          fail=0
          count=0
          for f in $(find src/main src/renderer tests/scripts -name "*.js" -o -name "*.mjs" | grep -v vendor); do
            count=$((count + 1))
            node --check "$f" || fail=1
          done
          echo "已检查 $count 个文件"
          if [ "$count" -eq 0 ]; then
            echo "::error::未找到任何待检查文件，语法检查路径配置可能有误"
            exit 1
          fi
          exit $fail
      - name: 依赖审计
        run: npm audit --audit-level=high
